<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ｜HOKKAIDO 未来リーダーズ</title>
<meta name="description" content="取材のご依頼、掲載に関するご相談、そのほかのお問い合わせはこちらから。">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/img/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ロゴと同じ荒れた質感をつくるフィルター群 -->
<svg class="u-defs" aria-hidden="true" focusable="false"><defs>
  <filter id="rough" x="-8%" y="-18%" width="116%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.08" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough-s" x="-6%" y="-14%" width="112%" height="128%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.11" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<header class="l-header">
  <div class="l-header__bar">
    <a class="l-header__logo" href="index.html"><img src="assets/img/logo_h_white.png" alt="HOKKAIDO 未来リーダーズ"></a>
    <nav class="l-header__nav">
      <a href="index.html#leaders">LEADERS</a><a href="index.html#index">INDEX</a>
      <a href="index.html#media">ON AIR</a><a href="contact.html">CONTACT</a>
    </nav>
  </div>
</header>

<main class="p-page">
  <div class="l-wrap">

    <div class="p-page__head">
      <h1 class="p-page__en">CONTACT</h1>
      <p class="p-page__ja">お問い合わせ</p>
    </div>

    <p class="p-page__lead">取材のご依頼、掲載に関するご相談、放送局との連携についてなど、お気軽にご連絡ください。<br>内容を確認のうえ、3営業日以内に担当者よりご返信します。</p>

    <!-- 送信先が未設定です。フォームの送信先（action / method）を設定してください -->
    <form class="c-form" action="" method="post">

      <div class="c-form__row">
        <label for="f-name">お名前<span class="c-form__req">必須</span></label>
        <input type="text" id="f-name" name="name" autocomplete="name" required>
      </div>

      <div class="c-form__row">
        <label for="f-company">会社名・団体名</label>
        <input type="text" id="f-company" name="company" autocomplete="organization">
      </div>

      <div class="c-form__row">
        <label for="f-email">メールアドレス<span class="c-form__req">必須</span></label>
        <input type="email" id="f-email" name="email" autocomplete="email" required>
      </div>

      <div class="c-form__row">
        <label for="f-tel">電話番号</label>
        <input type="text" id="f-tel" name="tel" autocomplete="tel" inputmode="tel">
      </div>

      <div class="c-form__row">
        <label for="f-type">お問い合わせの種類<span class="c-form__req">必須</span></label>
        <select id="f-type" name="type" required>
          <option value="">選択してください</option>
          <option>取材のご依頼</option>
          <option>掲載についてのご相談</option>
          <option>放送・メディア連携について</option>
          <option>掲載内容の修正・削除について</option>
          <option>その他</option>
        </select>
      </div>

      <div class="c-form__row">
        <label for="f-body">お問い合わせ内容<span class="c-form__req">必須</span></label>
        <textarea id="f-body" name="body" required></textarea>
      </div>

      <label class="c-form__check">
        <input type="checkbox" name="agree" required>
        <span><a href="policy.html">プライバシーポリシー</a>に同意のうえ送信します。</span>
      </label>

      <button class="c-form__btn" type="submit">SEND<i></i></button>

      <p class="c-form__note">送信いただいた内容は、お問い合わせへの回答および取材・掲載に関するご連絡にのみ使用します。</p>
    </form>

  </div>
</main>

<footer class="l-footer">
  <div class="l-wrap">
    <img class="l-footer__logo" src="assets/img/logo_white.png" alt="HOKKAIDO 未来リーダーズ">
    <nav class="l-footer__nav"><a href="index.html#leaders">LEADERS</a><a href="index.html#index">INDEX</a><a href="index.html#media">ON AIR</a><a href="contact.html">CONTACT</a><a href="policy.html">POLICY</a></nav>
    <p class="l-footer__cr">HOKKAIDO FUTURE LEADERS 2026 &nbsp;/&nbsp; &copy; 2026</p>
  </div>
</footer>

<script src="assets/js/site.js"></script>
</body>
</html>
